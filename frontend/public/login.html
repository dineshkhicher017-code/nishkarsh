<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nishkarsh — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-screen">

  <aside class="auth-hero">
    <div class="hero-content">
      <div class="wordmark">Nishkarsh</div>
      <p class="tagline">JEE PYQs, organized by what's actually breaking you — not by year.</p>

      <div class="motif" aria-hidden="true">
        <svg viewBox="0 0 320 220" class="trajectory">
          <path d="M 10 200 Q 100 20 300 190" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="200" r="3" fill="currentColor"/>
          <circle cx="300" cy="190" r="3" fill="currentColor"/>
        </svg>
        <div class="equation">s&nbsp;=&nbsp;ut&nbsp;+&nbsp;½at²</div>
      </div>

      <div class="hero-tags">
        <span>Kinematics</span>
        <span>Rotational Motion</span>
        <span>Electrostatics</span>
      </div>
    </div>
  </aside>

  <main class="auth-panel">
    <div class="auth-card">

      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" role="tab" aria-selected="true">Sign in</button>
        <button class="tab" id="tab-signup" role="tab" aria-selected="false">Create account</button>
      </div>

      <p class="form-error" id="form-error" hidden></p>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" autocomplete="email" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="auth-form" hidden>
        <label for="signup-name">Name</label>
        <input type="text" id="signup-name" name="name" autocomplete="name" required>

        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" name="email" autocomplete="email" required>

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" autocomplete="new-password" minlength="8" required>
        <p class="hint-text">At least 8 characters.</p>

        <button type="submit" class="btn-primary">Create account</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button type="button" class="btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <p class="admin-note">Admin? Use the invite link from your email for first-time setup.</p>

    </div>
  </main>

</div>

<script src="/js/practice.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
